[project]
site_name = "Zero Gen3 Log Format"
site_description = "Binary log format of the Zero Motorcycles Gen3 MBB and BMS"
site_url = "https://atomicdog.github.io/zero-log-parser/"
repo_url = "https://github.com/atomicdog/zero-log-parser"
repo_name = "atomicdog/zero-log-parser"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Overview" = "index.md" },
  { "File format" = "file-format.md" },
  { "Entry framing" = "framing.md" },
  { "MBB" = [
    "mbb/index.md",
    { "Periodic" = "mbb/periodic.md" },
    { "BMS & lock status" = "mbb/status.md" },
    { "Charging" = "mbb/charging.md" },
    { "Faults" = "mbb/faults.md" },
    { "Events" = "mbb/events.md" },
  ] },
  { "BMS" = [
    "bms/index.md",
    { "Periodic" = "bms/periodic.md" },
    { "Faults" = "bms/faults.md" },
    { "Cell data & limits" = "bms/cell-data.md" },
    { "Diagnostics" = "bms/diagnostics.md" },
  ] },
  { "Firmware versions" = "firmware.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
